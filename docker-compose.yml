services:
  hookscene:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hookscene-studio
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      # Persist model API disk cache across container restarts
      - ./backend/.cache:/app/backend/.cache
      # Persist CLI and app exported runs
      - ./outputs:/app/outputs
      # Allow editing config.yaml without rebuilding the container
      - ./backend/config.yaml:/app/backend/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
