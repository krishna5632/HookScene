<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="100%" height="100%" style="background:#0D1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="blue-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(56, 139, 253, 0.08)"/>
      <stop offset="100%" stop-color="rgba(56, 139, 253, 0.02)"/>
    </linearGradient>
    <linearGradient id="purple-box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(163, 113, 247, 0.08)"/>
      <stop offset="100%" stop-color="rgba(163, 113, 247, 0.02)"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B949E"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#58A6FF"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#BC8CFF"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1020" height="520" rx="12" fill="url(#bg-grad)"/>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: TRIGGERS / INPUTS                                            -->
  <!-- ========================================================================= -->

  <!-- Input 1: screenplay_upload -->
  <g transform="translate(25, 65)">
    <rect width="145" height="58" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <!-- GitHub / Script Icon -->
    <circle cx="25" cy="29" r="13" fill="#21262D"/>
    <path d="M20 23 h10 v12 h-10 z M23 26 h4 M23 29 h4 M23 32 h2" stroke="#C9D1D9" stroke-width="1.3" fill="none"/>
    <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">screenplay_run</text>
    <text x="46" y="40" fill="#8B949E" font-size="10">.txt / .zip / .srt</text>
  </g>

  <!-- Input 2: episode_pack -->
  <g transform="translate(25, 140)">
    <rect width="145" height="58" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="25" cy="29" r="13" fill="#21262D"/>
    <path d="M19 23 h12 v12 h-12 z M19 26 h12 M23 23 v3 M27 23 v3" stroke="#C9D1D9" stroke-width="1.3" fill="none"/>
    <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">50_episodes</text>
    <text x="46" y="40" fill="#8B949E" font-size="10">3,727 parsed lines</text>
  </g>

  <!-- Connecting curves from Triggers to Stage 1 -->
  <path d="M 170 94 C 185 94, 185 130, 205 130" fill="none" stroke="#8B949E" stroke-width="1.4"/>
  <path d="M 170 169 C 185 169, 185 130, 205 130" fill="none" stroke="#8B949E" stroke-width="1.4"/>
  <line x1="205" y1="130" x2="228" y2="130" stroke="#8B949E" stroke-width="1.4" marker-end="url(#arrow)"/>


  <!-- ========================================================================= -->
  <!-- TOP CONTAINER: AI DISCOVERY PIPELINE (BLUE THEME)                        -->
  <!-- ========================================================================= -->
  <rect x="215" y="40" width="780" height="195" rx="10" fill="url(#blue-box)" stroke="#388BFD" stroke-width="1.4"/>
  
  <!-- Container Header -->
  <g transform="translate(230, 58)">
    <circle cx="8" cy="8" r="6" fill="#1F6FEB"/>
    <circle cx="8" cy="8" r="2.5" fill="#FFFFFF"/>
    <text x="22" y="12" fill="#58A6FF" font-size="12" font-weight="700" letter-spacing="0.3px">
      AI Discovery &amp; Narrative Intelligence Pipeline (pipeline.py)
    </text>
  </g>

  <!-- Step 1: Ingest & Tokenize -->
  <g transform="translate(235, 95)">
    <rect width="135" height="70" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="67" y="26" text-anchor="middle" fill="#F0F6FC" font-size="12" font-weight="700">1. Ingest &amp; Parse</text>
    <text x="67" y="44" text-anchor="middle" fill="#8B949E" font-size="10">Line IDs (E01_L004)</text>
    <text x="67" y="58" text-anchor="middle" fill="#58A6FF" font-size="9.5" font-weight="600">Dialogue Map (cut_ok)</text>
  </g>

  <!-- Fork arrows out of Step 1 -->
  <path d="M 370 130 C 385 130, 385 105, 400 105" fill="none" stroke="#58A6FF" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <path d="M 370 130 C 385 130, 385 162, 400 162" fill="none" stroke="#8B949E" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Step 2: Story Arc & Spoiler Shield -->
  <g transform="translate(405, 78)">
    <rect width="155" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="77" y="22" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="700">2. Story &amp; Spoiler Shield</text>
    <text x="77" y="40" text-anchor="middle" fill="#F87171" font-size="9.5" font-weight="600">Lock Climax Eps 44–50</text>
  </g>

  <!-- Step 2 -> Step 3 arrow -->
  <line x1="560" y1="105" x2="578" y2="105" stroke="#58A6FF" stroke-width="1.4" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: Dramatic Peak Hunter -->
  <g transform="translate(585, 78)">
    <rect width="165" height="54" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="82" y="22" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="700">3. Peak Dramatic Radar</text>
    <text x="82" y="40" text-anchor="middle" fill="#8B949E" font-size="9.5">3s Hooks &amp; Cliffhangers</text>
  </g>

  <!-- Step 2b (Bottom): Rule Heuristic Backstop -->
  <g transform="translate(405, 142)">
    <rect width="155" height="42" rx="7" fill="#161B22" stroke="#30363D" stroke-width="1" stroke-dasharray="3,2" filter="url(#card-shadow)"/>
    <text x="77" y="18" text-anchor="middle" fill="#C9D1D9" font-size="10" font-weight="600">Rule Heuristic Backstop</text>
    <text x="77" y="32" text-anchor="middle" fill="#8B949E" font-size="8.5">Zero-cost keyword backup</text>
  </g>

  <!-- Step 3 -> Golden Gate Tag -->
  <path d="M 750 105 L 778 105" fill="none" stroke="#58A6FF" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <!-- Heuristic joins gate -->
  <path d="M 560 163 C 670 163, 720 120, 775 110" fill="none" stroke="#8B949E" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Golden Gate Pill: Line IDs Only (like image-scan.yml in user image) -->
  <g transform="translate(785, 75)">
    <rect width="190" height="60" rx="8" fill="#161B22" stroke="#F59E0B" stroke-width="1.6" filter="url(#card-shadow)"/>
    <!-- Lock / Tag Icon -->
    <circle cx="28" cy="30" r="14" fill="rgba(245, 158, 11, 0.15)"/>
    <path d="M23 28 h10 v8 h-10 z M25 28 v-3 a3 3 0 0 1 6 0 v3" stroke="#F59E0B" stroke-width="1.4" fill="none"/>
    <text x="50" y="27" fill="#F59E0B" font-size="11.5" font-weight="700">Line IDs Only</text>
    <text x="50" y="43" fill="#E6EDF3" font-size="9.5">No timestamps generated</text>
  </g>


  <!-- ========================================================================= -->
  <!-- CONNECTOR BETWEEN CONTAINERS (DASHED "when AI completes")                 -->
  <!-- ========================================================================= -->
  <path d="M 880 135 C 880 230, 290 200, 290 280" fill="none" stroke="#8B949E" stroke-width="1.4" stroke-dasharray="4,4"/>
  <rect x="520" y="235" width="220" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="630" y="249" text-anchor="middle" fill="#8B949E" font-size="9" font-family="monospace">
    deterministic handoff (exact millisecond math)
  </text>
  <line x1="290" y1="280" x2="290" y2="310" stroke="#8B949E" stroke-width="1.4" marker-end="url(#arrow)"/>


  <!-- ========================================================================= -->
  <!-- BOTTOM CONTAINER: DETERMINISTIC ENGINE & DELIVERY (PURPLE THEME)          -->
  <!-- ========================================================================= -->
  <rect x="215" y="280" width="780" height="200" rx="10" fill="url(#purple-box)" stroke="#A371F7" stroke-width="1.4"/>

  <!-- Container Header -->
  <g transform="translate(230, 298)">
    <circle cx="8" cy="8" r="6" fill="#8957E5"/>
    <circle cx="8" cy="8" r="2.5" fill="#FFFFFF"/>
    <text x="22" y="12" fill="#D2A8FF" font-size="12" font-weight="700" letter-spacing="0.3px">
      Deterministic Validation, Ranking &amp; Studio Delivery (validate.py)
    </text>
  </g>

  <!-- Step 4: Code Quality Gates -->
  <g transform="translate(235, 335)">
    <rect width="145" height="74" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="72" y="24" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="700">4. Code Gates</text>
    <text x="72" y="42" text-anchor="middle" fill="#3FB950" font-size="9.5" font-weight="600">Strict 20–60s Length</text>
    <text x="72" y="56" text-anchor="middle" fill="#8B949E" font-size="9">Hook Onset ≤ 3.0s</text>
    <text x="72" y="68" text-anchor="middle" fill="#8B949E" font-size="8.5">Dialogue Pause Snap</text>
  </g>

  <!-- Step 4 -> Step 5 arrow -->
  <line x1="380" y1="372" x2="400" y2="372" stroke="#BC8CFF" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

  <!-- Step 5: Dual-Judge Scoring (STACKED CARDS EFFECT like "test" in image) -->
  <g transform="translate(405, 335)">
    <!-- Back Stack 2 -->
    <rect x="6" y="-6" width="135" height="74" rx="8" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <!-- Back Stack 1 -->
    <rect x="3" y="-3" width="135" height="74" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <!-- Front Card -->
    <rect width="135" height="74" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="67" y="24" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="700">5. Dual-Judge</text>
    <text x="67" y="42" text-anchor="middle" fill="#D2A8FF" font-size="9.5" font-weight="600">5 Rubrics (Hook, Cliff...)</text>
    <text x="67" y="56" text-anchor="middle" fill="#8B949E" font-size="9">Voice Pacing Proxy</text>
    <text x="67" y="68" text-anchor="middle" fill="#58A6FF" font-size="8.5">Listwise Borda Count</text>
  </g>

  <!-- Step 5 -> Approval arrow -->
  <line x1="545" y1="372" x2="565" y2="372" stroke="#BC8CFF" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

  <!-- Step 6A: Approval / Review Desk (DASHED BORDER like Approval in user image) -->
  <g transform="translate(570, 335)">
    <rect width="145" height="74" rx="8" fill="#161B22" stroke="#8B949E" stroke-width="1.4" stroke-dasharray="4,3" filter="url(#card-shadow)"/>
    <!-- User/Reviewer Icon -->
    <circle cx="20" cy="22" r="7" fill="none" stroke="#D2A8FF" stroke-width="1.2"/>
    <path d="M13 32 c0 -4, 4 -5, 7 -5 s7 1, 7 5" fill="none" stroke="#D2A8FF" stroke-width="1.2"/>
    <text x="80" y="24" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="700">Editorial Review</text>
    <text x="72" y="42" text-anchor="middle" fill="#D2A8FF" font-size="9.5">Human Decision Desk</text>
    <text x="72" y="56" text-anchor="middle" fill="#8B949E" font-size="9">Approve / Reject</text>
    <text x="72" y="68" text-anchor="middle" fill="#8B949E" font-size="8.5">SQLite Failure Logs</text>
  </g>

  <!-- Approval -> Export arrow -->
  <line x1="715" y1="372" x2="735" y2="372" stroke="#BC8CFF" stroke-width="1.4" marker-end="url(#arrow-purple)"/>

  <!-- Step 6B: NLE Export & Studio Output -->
  <g transform="translate(740, 335)">
    <rect width="135" height="74" rx="8" fill="#161B22" stroke="#238636" stroke-width="1.4" filter="url(#card-shadow)"/>
    <text x="67" y="24" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="700">6. NLE Export</text>
    <text x="67" y="42" text-anchor="middle" fill="#3FB950" font-size="9.5" font-weight="600">EDL · XML · CSV · JSON</text>
    <text x="67" y="56" text-anchor="middle" fill="#8B949E" font-size="9">Single Cuts (20–60s)</text>
    <text x="67" y="68" text-anchor="middle" fill="#8B949E" font-size="8.5">Jump Cut Montages</text>
  </g>

  <!-- Export -> Final Deliverable Arrow -->
  <line x1="875" y1="372" x2="893" y2="372" stroke="#3FB950" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Final Delivery Pill (Far Right Accent Card) -->
  <g transform="translate(898, 342)">
    <rect width="85" height="60" rx="8" fill="#161B22" stroke="#3FB950" stroke-width="1.6" filter="url(#card-shadow)"/>
    <text x="42" y="24" text-anchor="middle" font-size="14">📱</text>
    <text x="42" y="40" text-anchor="middle" fill="#3FB950" font-size="10" font-weight="700">TikTok</text>
    <text x="42" y="52" text-anchor="middle" fill="#8B949E" font-size="8.5">Reels / Shorts</text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM LEFT TRIGGER: REVIEW FEEDBACK                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 343)">
    <rect width="145" height="58" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="25" cy="29" r="13" fill="#21262D"/>
    <!-- Feedback sync loop -->
    <path d="M21 29 a4 4 0 1 1 7 2.8 M28 32 v-3 h-3" stroke="#D2A8FF" stroke-width="1.3" fill="none"/>
    <text x="46" y="24" fill="#F0F6FC" font-size="12" font-weight="600">review_sync</text>
    <text x="46" y="40" fill="#8B949E" font-size="10">SQLite failure audit</text>
  </g>

  <path d="M 170 372 L 230 372" fill="none" stroke="#8B949E" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
</svg>