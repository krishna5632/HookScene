<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 500" width="100%" height="100%" style="background:#0D1117; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Refined Monochrome Theme Defs -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Subtle container fill -->
    <linearGradient id="container-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.02)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.005)"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="124%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- Uniform Neutral Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6E7681"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#8B949E"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1020" height="500" rx="10" fill="url(#bg-grad)"/>

  <!-- ========================================================================= -->
  <!-- LEFT COLUMN: INPUT TRIGGERS (Monochrome)                                  -->
  <!-- ========================================================================= -->

  <!-- Input 1: screenplay_run -->
  <g transform="translate(25, 60)">
    <rect width="145" height="56" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="24" cy="28" r="12" fill="#21262D"/>
    <!-- Script icon -->
    <path d="M19 22 h10 v12 h-10 z M22 25 h4 M22 28 h4 M22 31 h2" stroke="#8B949E" stroke-width="1.2" fill="none"/>
    <text x="45" y="24" fill="#F0F6FC" font-size="12" font-weight="600">screenplay_run</text>
    <text x="45" y="39" fill="#8B949E" font-size="10">.txt · .zip · .srt</text>
  </g>

  <!-- Input 2: 50_episodes -->
  <g transform="translate(25, 132)">
    <rect width="145" height="56" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="24" cy="28" r="12" fill="#21262D"/>
    <!-- Film frame icon -->
    <path d="M18 22 h12 v12 h-12 z M18 25 h12 M22 22 v3 M26 22 v3" stroke="#8B949E" stroke-width="1.2" fill="none"/>
    <text x="45" y="24" fill="#F0F6FC" font-size="12" font-weight="600">50_episodes</text>
    <text x="45" y="39" fill="#8B949E" font-size="10">3,727 structured lines</text>
  </g>

  <!-- Input Connectors -->
  <path d="M 170 88 C 185 88, 185 120, 205 120" fill="none" stroke="#484F58" stroke-width="1.4"/>
  <path d="M 170 160 C 185 160, 185 120, 205 120" fill="none" stroke="#484F58" stroke-width="1.4"/>
  <line x1="205" y1="120" x2="228" y2="120" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>


  <!-- ========================================================================= -->
  <!-- TOP WORKFLOW CONTAINER: AI DISCOVERY                                      -->
  <!-- ========================================================================= -->
  <rect x="215" y="35" width="780" height="185" rx="8" fill="url(#container-fill)" stroke="#30363D" stroke-width="1.2"/>
  
  <!-- Container Header -->
  <g transform="translate(230, 52)">
    <circle cx="6" cy="6" r="4.5" fill="#30363D"/>
    <circle cx="6" cy="6" r="2" fill="#8B949E"/>
    <text x="18" y="10" fill="#E6EDF3" font-size="11.5" font-weight="600" letter-spacing="0.2px">
      AI Discovery &amp; Narrative Intelligence (pipeline.py)
    </text>
  </g>

  <!-- Step 1: Ingest & Parse -->
  <g transform="translate(235, 85)">
    <rect width="135" height="66" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="67" y="24" text-anchor="middle" fill="#F0F6FC" font-size="11.5" font-weight="600">1. Ingest &amp; Parse</text>
    <text x="67" y="42" text-anchor="middle" fill="#8B949E" font-size="10">Line IDs (E01_L004)</text>
    <text x="67" y="55" text-anchor="middle" fill="#8B949E" font-size="9.5">Dialogue Map (cut_ok)</text>
  </g>

  <!-- Step 1 Branch Connectors -->
  <path d="M 370 118 C 385 118, 385 96, 400 96" fill="none" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 370 118 C 385 118, 385 152, 400 152" fill="none" stroke="#484F58" stroke-width="1.4" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Step 2: Story Arc & Spoiler Shield -->
  <g transform="translate(405, 72)">
    <rect width="155" height="50" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="77" y="21" text-anchor="middle" fill="#F0F6FC" font-size="11" font-weight="600">2. Story &amp; Spoiler Shield</text>
    <text x="77" y="38" text-anchor="middle" fill="#8B949E" font-size="9.5">Lock Climax Eps 44–50</text>
  </g>

  <!-- Step 2 -> Step 3 -->
  <line x1="560" y1="97" x2="578" y2="97" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 3: Peak Dramatic Radar -->
  <g transform="translate(585, 72)">
    <rect width="160" height="50" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="80" y="21" text-anchor="middle" fill="#F0F6FC" font-size="11" font-weight="600">3. Peak Dramatic Radar</text>
    <text x="80" y="38" text-anchor="middle" fill="#8B949E" font-size="9.5">3s Hooks &amp; Cliffhangers</text>
  </g>

  <!-- Backup: Rule Heuristic -->
  <g transform="translate(405, 134)">
    <rect width="155" height="42" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" stroke-dasharray="3,2" filter="url(#card-shadow)"/>
    <text x="77" y="18" text-anchor="middle" fill="#C9D1D9" font-size="10" font-weight="500">Rule Heuristic Backstop</text>
    <text x="77" y="31" text-anchor="middle" fill="#8B949E" font-size="8.5">Zero-cost keyword backup</text>
  </g>

  <!-- Step 3 -> Gate -->
  <line x1="745" y1="97" x2="773" y2="97" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M 560 155 C 660 155, 720 115, 770 102" fill="none" stroke="#484F58" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Key Architectural Gate: Line IDs Only (Clean subtle border) -->
  <g transform="translate(780, 68)">
    <rect width="195" height="58" rx="6" fill="#161B22" stroke="#484F58" stroke-width="1.4" filter="url(#card-shadow)"/>
    <!-- Lock Icon -->
    <circle cx="26" cy="29" r="12" fill="#21262D"/>
    <path d="M22 27 h8 v7 h-8 z M23 27 v-2.5 a2.5 2.5 0 0 1 5 0 v2.5" stroke="#8B949E" stroke-width="1.3" fill="none"/>
    <text x="46" y="25" fill="#F0F6FC" font-size="11.5" font-weight="600">Line IDs Only</text>
    <text x="46" y="41" fill="#8B949E" font-size="9.5">No timestamps generated</text>
  </g>


  <!-- ========================================================================= -->
  <!-- CROSS-WORKFLOW CONNECTOR (Clean Dashed Line)                              -->
  <!-- ========================================================================= -->
  <path d="M 877 126 C 877 215, 290 190, 290 260" fill="none" stroke="#484F58" stroke-width="1.4" stroke-dasharray="4,4"/>
  <rect x="490" y="222" width="260" height="20" rx="4" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <text x="620" y="236" text-anchor="middle" fill="#8B949E" font-size="9" font-family="ui-monospace, monospace">
    deterministic handoff (exact millisecond math)
  </text>
  <line x1="290" y1="260" x2="290" y2="292" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>


  <!-- ========================================================================= -->
  <!-- BOTTOM WORKFLOW CONTAINER: DETERMINISTIC VALIDATION & DELIVERY            -->
  <!-- ========================================================================= -->
  <rect x="215" y="265" width="780" height="195" rx="8" fill="url(#container-fill)" stroke="#30363D" stroke-width="1.2"/>

  <!-- Container Header -->
  <g transform="translate(230, 282)">
    <circle cx="6" cy="6" r="4.5" fill="#30363D"/>
    <circle cx="6" cy="6" r="2" fill="#8B949E"/>
    <text x="18" y="10" fill="#E6EDF3" font-size="11.5" font-weight="600" letter-spacing="0.2px">
      Deterministic Validation &amp; Studio Delivery (validate.py)
    </text>
  </g>

  <!-- Step 4: Code Quality Gates -->
  <g transform="translate(235, 315)">
    <rect width="140" height="70" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="70" y="22" text-anchor="middle" fill="#F0F6FC" font-size="11" font-weight="600">4. Code Gates</text>
    <text x="70" y="38" text-anchor="middle" fill="#8B949E" font-size="9.5">Strict 20–60s Length</text>
    <text x="70" y="51" text-anchor="middle" fill="#8B949E" font-size="9">Hook Onset ≤ 3.0s</text>
    <text x="70" y="63" text-anchor="middle" fill="#8B949E" font-size="8.5">Dialogue Pause Snap</text>
  </g>

  <!-- Step 4 -> Step 5 -->
  <line x1="375" y1="350" x2="395" y2="350" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 5: Dual-Judge Scoring (STACKED CARDS EFFECT) -->
  <g transform="translate(400, 315)">
    <!-- Back Card 2 -->
    <rect x="4" y="-4" width="135" height="70" rx="6" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <!-- Back Card 1 -->
    <rect x="2" y="-2" width="135" height="70" rx="6" fill="#161B22" stroke="#282E33" stroke-width="1"/>
    <!-- Front Card -->
    <rect width="135" height="70" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="67" y="22" text-anchor="middle" fill="#F0F6FC" font-size="11" font-weight="600">5. Dual-Judge</text>
    <text x="67" y="38" text-anchor="middle" fill="#8B949E" font-size="9.5">5-Rubric AI Evaluation</text>
    <text x="67" y="51" text-anchor="middle" fill="#8B949E" font-size="9">Voice Pacing Proxy</text>
    <text x="67" y="63" text-anchor="middle" fill="#8B949E" font-size="8.5">Listwise Borda Count</text>
  </g>

  <!-- Step 5 -> Approval -->
  <line x1="535" y1="350" x2="555" y2="350" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 6A: Approval / Review Desk (Dashed Border) -->
  <g transform="translate(560, 315)">
    <rect width="145" height="70" rx="6" fill="#161B22" stroke="#484F58" stroke-width="1.3" stroke-dasharray="4,3" filter="url(#card-shadow)"/>
    <!-- Reviewer Icon -->
    <circle cx="20" cy="20" r="6" fill="none" stroke="#8B949E" stroke-width="1.2"/>
    <path d="M14 29 c0 -3.5, 3.5 -4.5, 6 -4.5 s6 1, 6 4.5" fill="none" stroke="#8B949E" stroke-width="1.2"/>
    <text x="80" y="22" text-anchor="middle" fill="#F0F6FC" font-size="11" font-weight="600">Editorial Review</text>
    <text x="72" y="38" text-anchor="middle" fill="#8B949E" font-size="9.5">Human Decision Desk</text>
    <text x="72" y="51" text-anchor="middle" fill="#8B949E" font-size="9">Approve / Reject</text>
    <text x="72" y="63" text-anchor="middle" fill="#8B949E" font-size="8.5">SQLite Failure Logs</text>
  </g>

  <!-- Approval -> Export -->
  <line x1="705" y1="350" x2="725" y2="350" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Step 6B: NLE Export -->
  <g transform="translate(730, 315)">
    <rect width="135" height="70" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <text x="67" y="22" text-anchor="middle" fill="#F0F6FC" font-size="11" font-weight="600">6. NLE Export</text>
    <text x="67" y="38" text-anchor="middle" fill="#8B949E" font-size="9.5">EDL · XML · CSV · JSON</text>
    <text x="67" y="51" text-anchor="middle" fill="#8B949E" font-size="9">Continuous Single Cuts</text>
    <text x="67" y="63" text-anchor="middle" fill="#8B949E" font-size="8.5">Paced Jump Montages</text>
  </g>

  <!-- Export -> Final Output -->
  <line x1="865" y1="350" x2="885" y2="350" stroke="#484F58" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Final Delivery Card -->
  <g transform="translate(890, 322)">
    <rect width="85" height="56" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <!-- Phone / Vertical Video Icon -->
    <rect x="36" y="12" width="12" height="18" rx="2" fill="none" stroke="#8B949E" stroke-width="1.2"/>
    <circle cx="42" cy="27" r="1" fill="#8B949E"/>
    <text x="42" y="38" text-anchor="middle" fill="#F0F6FC" font-size="9.5" font-weight="600">TikTok</text>
    <text x="42" y="49" text-anchor="middle" fill="#8B949E" font-size="8">Reels / Shorts</text>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM LEFT TRIGGER: REVIEW FEEDBACK                                      -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 322)">
    <rect width="145" height="56" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.2" filter="url(#card-shadow)"/>
    <circle cx="24" cy="28" r="12" fill="#21262D"/>
    <!-- Sync loop icon -->
    <path d="M20 28 a4 4 0 1 1 7 2.8 M27 31 v-3 h-3" stroke="#8B949E" stroke-width="1.2" fill="none"/>
    <text x="45" y="24" fill="#F0F6FC" font-size="12" font-weight="600">review_sync</text>
    <text x="45" y="39" fill="#8B949E" font-size="10">SQLite failure audit</text>
  </g>

  <path d="M 170 350 L 230 350" fill="none" stroke="#484F58" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
</svg>